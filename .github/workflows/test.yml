name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # 本地测试不需要真的 Cloudflare 资源 id，用范本就可以
      - run: cp wrangler.example.jsonc wrangler.jsonc
      - run: npm test
